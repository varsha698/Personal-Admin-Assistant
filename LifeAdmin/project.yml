name: LifeAdmin
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES

targets:
  LifeAdmin:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Features
      - path: Services
      - path: Persistence
    resources:
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: LifeAdmin
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCalendarsFullAccessUsageDescription: LifeAdmin reads and writes your calendar so it can show your day and add events you approve.
        NSRemindersFullAccessUsageDescription: LifeAdmin reads and writes your reminders so tasks stay in sync with iOS.
        NSUserNotificationsUsageDescription: LifeAdmin schedules local reminders for your tasks and commitments.
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.lifeadmin.refresh
        UIBackgroundModes:
          - fetch
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lifeadmin
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: Resources/LifeAdmin.entitlements
